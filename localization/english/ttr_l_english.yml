l_english:
 ttr.0001.t:0 "Judgment after the War"
 ttr.0001.desc:0 "The rebellion has been defeated. Those who surrendered into my custody now await judgment for their part in this war. I can hear their cases together, one after another."
 ttr.0001.begin:0 "Hear their cases."
 ttr.0001.skip:0 "No further sentences after this war."
 ttr_hearing_title:0 "A Hearing for Disloyalty"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName] stands accused before me. The charge is recorded:"
 ttr_charge_rebellion:0 "\n\n#bold Defiance of my authority.#! Rebellion or refusal of my demand is recorded against the accused."
 ttr_charge_oathbreaker:0 "\n\n#bold Oathbreaking against me.#! The accused broke an oath owed to me."
 ttr_hearing_outro:0 "\n\nI must decide what is to be done. Only sentences I can lawfully impose are available."
 ttr_hearing_invalid:0 "This case can no longer be heard here. The accused may have died, left my jurisdiction, or ceased to face these charges."
 ttr_hearing_keep:0 "Remain imprisoned. Next case."
 ttr_hearing_pardon:0 "I pardon these acts of disloyalty."
 ttr_hearing_revoke:0 "Consider confiscating a title."
 ttr_hearing_execute:0 "Carry out the lawful execution."
 ttr_hearing_next:0 "Move to the next case."
 ttr_hearing_finish:0 "End the remaining hearings without further sentences."
 ttr_keep_tt:0 "This prisoner remains in custody. Continue to the next defeated rebel; this case will not return in this settlement."
 ttr_pardon_tt:0 "Pardon only the rebellion, refusal and oathbreaking charges against you. An accused held in your prison is released only if no other criminal grounds remain."
 ttr_revoke_tt:0 "Open the native title revocation window immediately, while time remains paused. The usual requirements and consequences apply. Sending the demand or closing the window continues to the next case automatically."
 ttr_execute_tt:0 "Execute this prisoner only while execution is permitted without tyranny. The usual consequences of execution still apply."
 ttr_finish_tt:0 "Finish this war's remaining cases without adding any punishment or pardon. Their existing custody and titles remain unchanged. These hearings will not reopen later."
 ttr_invalid_tt:0 "No punishment is imposed. Continue with the remaining eligible cases."
 ttr_execution_special_context_tt:0 "A sentence cannot be carried out here while a regency or a shared rule requires additional approval."
 ttr.0090.t:0 "The Hearings Are Complete"
 ttr.0090.desc:0 "There are no further eligible cases in this session. My judgments stand; cases set aside have brought no further punishment."
 ttr.0090.close:0 "Let the court return to its business."
