l_simp_chinese:
 ttr.0001.t:0 "战后的审判"
 ttr.0001.desc:0 "叛乱已被平定。那些投降后被我关押的人，正等待着因参与这场战争而接受审判。我可以集中审理他们的案件，逐一作出裁决。"
 ttr.0001.begin:0 "审理他们的案件。"
 ttr.0001.skip:0 "这场战争之后，不再追加判罚。"
 ttr_hearing_title:0 "不忠之罪的审理"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName]作为被告站在我面前。记录在案的罪名如下："
 ttr_charge_rebellion:0 "\n\n#bold 违抗我的权威。#! 被告犯有叛乱或拒绝服从我要求的罪行。"
 ttr_charge_oathbreaker:0 "\n\n#bold 背弃对我所立的誓言。#! 被告违背了向我许下的誓言。"
 ttr_hearing_outro:0 "\n\n我必须决定如何处置。可选的只有我依法能够施加的刑罚。"
 ttr_hearing_invalid:0 "此案已无法在这里审理。被告可能已经死亡、脱离我的管辖，或已不再受到这些指控。"
 ttr_hearing_keep:0 "继续关押。下一案。"
 ttr_hearing_pardon:0 "我赦免这些不忠之举。"
 ttr_hearing_revoke:0 "考虑剥夺一个头衔。"
 ttr_hearing_execute:0 "依法处决。"
 ttr_hearing_next:0 "转到下一案。"
 ttr_hearing_finish:0 "结束剩余审理，不再追加判罚。"
 ttr_keep_tt:0 "此囚犯将继续被关押。接着审理下一名战败叛乱者；在处理这场战争的善后事务时，本案不会再次开庭。"
 ttr_pardon_tt:0 "仅赦免针对你的叛乱、拒不服从及背誓罪行。关押在你牢中的被告，只有在不再存在其他处罚依据时才会获释。"
 ttr_revoke_tt:0 "立即打开游戏原有的剥夺头衔窗口，同时保持暂停。通常的要求和后果仍然适用。发出要求或关闭窗口后，会自动转到下一案。"
 ttr_execute_tt:0 "仅在处决获准且不会产生暴政时处决此囚犯。处决通常会带来的后果仍然适用。"
 ttr_finish_tt:0 "结束这场战争的剩余案件，不追加处罚，也不予以赦免。现有的关押状态和头衔保持不变。这些审理此后不会重新开启。"
 ttr_invalid_tt:0 "不施加任何处罚。继续审理其余符合条件的案件。"
 ttr_execution_special_context_tt:0 "摄政或共治需要额外批准时，无法在此执行判决。"
 ttr.0090.t:0 "审理结束"
 ttr.0090.desc:0 "此次庭审中已无其他符合条件的案件。我的裁决已经作出；搁置的案件未受到进一步处罚。"
 ttr.0090.close:0 "让宫廷回归日常事务。"
