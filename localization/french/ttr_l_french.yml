l_french:
 ttr.0001.t:0 "Le jugement après la guerre"
 ttr.0001.desc:0 "La rébellion a été vaincue. Ceux qui se sont rendus et sont désormais sous ma garde attendent leur jugement pour leur rôle dans cette guerre. Je peux examiner leurs affaires ensemble, l'une après l'autre."
 ttr.0001.begin:0 "Examiner leurs affaires."
 ttr.0001.skip:0 "Pas d'autres condamnations après cette guerre."
 ttr_hearing_title:0 "Une audience pour déloyauté"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName] comparaît devant moi. Voici l'accusation :"
 ttr_charge_rebellion:0 "\n\n#bold Défi à mon autorité.#! La personne accusée s'est rebellée ou a refusé de satisfaire à mon exigence."
 ttr_charge_oathbreaker:0 "\n\n#bold Violation d'un serment envers moi.#! La personne accusée a rompu un serment qu'elle m'avait prêté."
 ttr_hearing_outro:0 "\n\nJe dois décider de son sort. Seules les peines que je peux légalement infliger sont disponibles."
 ttr_hearing_invalid:0 "Cette affaire ne peut plus être jugée ici. La personne accusée peut être morte, avoir échappé à ma juridiction ou ne plus faire l'objet de ces accusations."
 ttr_hearing_keep:0 "Rester en prison. Affaire suivante."
 ttr_hearing_pardon:0 "Je pardonne ces actes de déloyauté."
 ttr_hearing_revoke:0 "Envisager la confiscation d'un titre."
 ttr_hearing_execute:0 "Procéder à l'exécution légale."
 ttr_hearing_next:0 "Passer à l'affaire suivante."
 ttr_hearing_finish:0 "Clore les audiences restantes sans nouvelles condamnations."
 ttr_keep_tt:0 "Cette personne reste en détention. Passez au prochain rebelle vaincu ; cette affaire ne sera pas réexaminée dans le cadre du règlement de cette guerre."
 ttr_pardon_tt:0 "Pardonner uniquement les actes de rébellion, de refus d'obéir et de violation de serment commis à votre encontre. Une personne détenue dans votre prison n'est libérée que s'il ne reste aucun autre motif de sanction pénale."
 ttr_revoke_tt:0 "Ouvrir immédiatement la fenêtre habituelle de révocation de titres, tout en maintenant la pause. Les conditions et conséquences habituelles s'appliquent. L'envoi de l'exigence ou la fermeture de la fenêtre fait automatiquement passer à l'affaire suivante."
 ttr_execute_tt:0 "Exécuter cette personne uniquement tant que l'exécution est permise sans tyrannie. Les conséquences habituelles d'une exécution s'appliquent toujours."
 ttr_finish_tt:0 "Clore les affaires restantes de cette guerre sans infliger de peine ni accorder de pardon. La détention et les titres actuels restent inchangés. Ces audiences ne reprendront pas plus tard."
 ttr_invalid_tt:0 "Aucune peine n'est infligée. Poursuivre avec les affaires restantes qui peuvent encore être jugées."
 ttr_execution_special_context_tt:0 "Une peine ne peut pas être exécutée ici tant qu'une régence ou un règne partagé nécessite une approbation supplémentaire."
 ttr.0090.t:0 "Les audiences sont terminées"
 ttr.0090.desc:0 "Il ne reste plus d'affaires à juger lors de cette séance. Mes jugements sont rendus ; les affaires écartées n'ont entraîné aucune peine supplémentaire."
 ttr.0090.close:0 "Que la cour reprenne ses occupations."
