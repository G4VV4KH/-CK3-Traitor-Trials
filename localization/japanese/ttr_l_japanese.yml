l_japanese:
 ttr.0001.t:0 "戦後の裁き"
 ttr.0001.desc:0 "反乱は鎮圧された。降伏して私の牢に入った者たちは、この戦争に加担した罪への裁きを待っている。その一人ひとりを、続けて審理することができる。"
 ttr.0001.begin:0 "審理を始めよう。"
 ttr.0001.skip:0 "この戦争の後に、これ以上の刑は科さない。"
 ttr_hearing_title:0 "不忠の審理"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName]が被告として私の前に立っている。記録された罪状は次のとおりだ。"
 ttr_charge_rebellion:0 "\n\n#bold 我が権威への反抗。#! 被告には、反乱を起こした、あるいは私の要求を拒んだ罪がある。"
 ttr_charge_oathbreaker:0 "\n\n#bold 私に対する誓約の違反。#! 被告は私に立てた誓いを破った。"
 ttr_hearing_outro:0 "\n\n処遇を決めなければならない。選べるのは、私が法に従って科せる刑だけだ。"
 ttr_hearing_invalid:0 "この件は、もはやここで審理できない。被告が死亡したか、私の裁判権が及ばなくなったか、これらの罪に問われなくなった可能性がある。"
 ttr_hearing_keep:0 "投獄を続けよ。次の審理へ。"
 ttr_hearing_pardon:0 "これらの不忠の罪を赦す。"
 ttr_hearing_revoke:0 "称号の剥奪を検討する。"
 ttr_hearing_execute:0 "法に従って処刑せよ。"
 ttr_hearing_next:0 "次の審理に移る。"
 ttr_hearing_finish:0 "これ以上の刑を科さず、残りの審理を終える。"
 ttr_keep_tt:0 "この囚人の拘禁は続きます。次の敗れた反乱者の審理へ進みます。この戦争の処理において、この件が再び審理されることはありません。"
 ttr_pardon_tt:0 "あなたに対する反乱、服従の拒否、誓約違反の罪だけを赦します。あなたの牢にいる被告は、ほかに処罰の根拠となる罪が残っていない場合にのみ解放されます。"
 ttr_revoke_tt:0 "時間を一時停止したまま、通常の称号剥奪画面をただちに開きます。通常の条件と結果が適用されます。要求を送るか画面を閉じると、自動的に次の審理へ進みます。"
 ttr_execute_tt:0 "暴政とならずに処刑が認められる場合にのみ、この囚人を処刑します。処刑による通常の影響は引き続き適用されます。"
 ttr_finish_tt:0 "刑罰も赦免も加えず、この戦争の残りの審理を終えます。現在の拘禁状態と称号は変わりません。これらの審理が後で再開されることはありません。"
 ttr_invalid_tt:0 "刑罰は科されません。審理可能な残りの件へ進みます。"
 ttr_execution_special_context_tt:0 "摂政制や共同統治により追加の承認が必要な間は、ここで刑を執行できません。"
 ttr.0090.t:0 "審理の終了"
 ttr.0090.desc:0 "今回の裁きで審理できる件は、もう残っていない。私の裁定は下された。審理を見送った件には、追加の刑は科されていない。"
 ttr.0090.close:0 "宮廷をいつもの務めに戻そう。"
