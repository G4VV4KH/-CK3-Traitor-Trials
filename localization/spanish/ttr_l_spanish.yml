l_spanish:
 ttr.0001.t:0 "Juicio tras la guerra"
 ttr.0001.desc:0 "La rebelión ha sido derrotada. Quienes se rindieron y quedaron bajo mi custodia esperan ahora ser juzgados por su participación en esta guerra. Puedo examinar sus casos juntos, uno tras otro."
 ttr.0001.begin:0 "Examinar sus casos."
 ttr.0001.skip:0 "No habrá más condenas tras esta guerra."
 ttr_hearing_title:0 "Una audiencia por deslealtad"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName] comparece ante mí. La acusación consta por escrito:"
 ttr_charge_rebellion:0 "\n\n#bold Desafío a mi autoridad.#! La acusación es de rebelión o de haberse negado a cumplir mi exigencia."
 ttr_charge_oathbreaker:0 "\n\n#bold Quebrantamiento de un juramento hacia mí.#! Se ha faltado a un juramento que me fue prestado."
 ttr_hearing_outro:0 "\n\nDebo decidir qué hacer. Solo están disponibles las penas que puedo imponer legalmente."
 ttr_hearing_invalid:0 "Este caso ya no puede juzgarse aquí. La persona acusada puede haber muerto, haber quedado fuera de mi jurisdicción o haber dejado de responder por estos cargos."
 ttr_hearing_keep:0 "Que siga en prisión. Siguiente caso."
 ttr_hearing_pardon:0 "Perdono estos actos de deslealtad."
 ttr_hearing_revoke:0 "Considerar la confiscación de un título."
 ttr_hearing_execute:0 "Llevar a cabo la ejecución legal."
 ttr_hearing_next:0 "Pasar al siguiente caso."
 ttr_hearing_finish:0 "Dar por concluidas las audiencias restantes sin más condenas."
 ttr_keep_tt:0 "Esta persona seguirá en prisión. Continúa con el siguiente rebelde derrotado; este caso no volverá a juzgarse al resolver las consecuencias de esta guerra."
 ttr_pardon_tt:0 "Perdonar solo los cargos de rebelión, desobediencia y quebrantamiento de juramentos contra ti. Una persona acusada que esté en tu prisión solo será liberada si no quedan otros motivos penales para castigarla."
 ttr_revoke_tt:0 "Abrir inmediatamente la ventana habitual de revocación de títulos, manteniendo la pausa. Se aplican los requisitos y consecuencias habituales. Al enviar la exigencia o cerrar la ventana, se pasa automáticamente al siguiente caso."
 ttr_execute_tt:0 "Ejecutar a esta persona solo mientras la ejecución esté permitida sin tiranía. Se siguen aplicando las consecuencias habituales de una ejecución."
 ttr_finish_tt:0 "Concluir los casos restantes de esta guerra sin añadir castigos ni conceder perdones. La reclusión y los títulos actuales permanecerán intactos. Estas audiencias no volverán a abrirse más adelante."
 ttr_invalid_tt:0 "No se impone ningún castigo. Continuar con los casos restantes que aún puedan juzgarse."
 ttr_execution_special_context_tt:0 "No se puede ejecutar una sentencia aquí mientras una regencia o un gobierno compartido exijan una aprobación adicional."
 ttr.0090.t:0 "Las audiencias han concluido"
 ttr.0090.desc:0 "No quedan más casos que puedan juzgarse en esta sesión. Mis sentencias quedan dictadas; los casos que se dejaron de lado no han acarreado más castigos."
 ttr.0090.close:0 "Que la corte vuelva a sus asuntos."
