l_german:
 ttr.0001.t:0 "Urteil nach dem Krieg"
 ttr.0001.desc:0 "Der Aufstand ist niedergeschlagen. Wer sich ergeben hat und sich nun in meinem Gewahrsam befindet, wartet auf ein Urteil für die Beteiligung an diesem Krieg. Ich kann die Fälle gemeinsam und einen nach dem anderen verhandeln."
 ttr.0001.begin:0 "Ihre Fälle verhandeln."
 ttr.0001.skip:0 "Keine weiteren Urteile nach diesem Krieg."
 ttr_hearing_title:0 "Eine Verhandlung wegen Untreue"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName] steht vor mir unter Anklage. Die Anschuldigung lautet:"
 ttr_charge_rebellion:0 "\n\n#bold Missachtung meiner Autorität.#! Der angeklagten Person wird ein Aufstand oder die Verweigerung meiner Forderung vorgeworfen."
 ttr_charge_oathbreaker:0 "\n\n#bold Eidbruch mir gegenüber.#! Die angeklagte Person hat einen mir geschworenen Eid gebrochen."
 ttr_hearing_outro:0 "\n\nIch muss entscheiden, was geschehen soll. Nur Strafen, die ich rechtmäßig verhängen darf, stehen zur Wahl."
 ttr_hearing_invalid:0 "Dieser Fall kann hier nicht mehr verhandelt werden. Die angeklagte Person könnte verstorben sein, außerhalb meiner Gerichtsbarkeit stehen oder diesen Anschuldigungen nicht mehr unterliegen."
 ttr_hearing_keep:0 "In Haft belassen. Nächster Fall."
 ttr_hearing_pardon:0 "Ich vergebe diese Taten der Untreue."
 ttr_hearing_revoke:0 "Den Entzug eines Titels erwägen."
 ttr_hearing_execute:0 "Die rechtmäßige Hinrichtung vollstrecken."
 ttr_hearing_next:0 "Zum nächsten Fall übergehen."
 ttr_hearing_finish:0 "Die übrigen Verhandlungen ohne weitere Urteile beenden."
 ttr_keep_tt:0 "Diese Person bleibt in Haft. Fahrt mit dem nächsten besiegten Aufständischen fort; dieser Fall wird bei der Beilegung dieses Krieges nicht erneut verhandelt."
 ttr_pardon_tt:0 "Nur Aufstand, Gehorsamsverweigerung und Eidbruch gegen Euch werden vergeben. Eine in Eurem Kerker festgehaltene Person wird nur freigelassen, wenn keine anderen Strafgründe mehr bestehen."
 ttr_revoke_tt:0 "Sofort das reguläre Fenster zum Titelentzug öffnen, während die Zeit angehalten bleibt. Es gelten die üblichen Voraussetzungen und Folgen. Nach dem Absenden der Forderung oder dem Schließen des Fensters geht es automatisch mit dem nächsten Fall weiter."
 ttr_execute_tt:0 "Diese Person nur hinrichten, solange die Hinrichtung ohne Tyrannei zulässig ist. Die üblichen Folgen einer Hinrichtung gelten weiterhin."
 ttr_finish_tt:0 "Die übrigen Fälle dieses Krieges ohne zusätzliche Strafe oder Begnadigung abschließen. Bestehende Haft und Titel bleiben unverändert. Diese Verhandlungen werden später nicht wieder aufgenommen."
 ttr_invalid_tt:0 "Es wird keine Strafe verhängt. Mit den verbleibenden zulässigen Fällen fortfahren."
 ttr_execution_special_context_tt:0 "Eine Strafe kann hier nicht vollstreckt werden, solange eine Regentschaft oder eine gemeinsame Herrschaft eine zusätzliche Zustimmung erfordert."
 ttr.0090.t:0 "Die Verhandlungen sind abgeschlossen"
 ttr.0090.desc:0 "In dieser Sitzung gibt es keine weiteren zulässigen Fälle. Meine Urteile stehen fest; zurückgestellte Fälle haben keine weiteren Strafen nach sich gezogen."
 ttr.0090.close:0 "Der Hof soll sich wieder seinen Geschäften widmen."
