l_russian:
 ttr.0001.t:0 "Суд после войны"
 ttr.0001.desc:0 "Мятеж подавлен. Сдавшиеся под мою стражу участники этой войны ждут решения своей участи. Их дела можно рассмотреть вместе, одно за другим."
 ttr.0001.begin:0 "Рассмотреть их дела."
 ttr.0001.skip:0 "Обойдёмся без новых приговоров после этой войны."
 ttr_hearing_title:0 "Суд за неверность"
 ttr_hearing_intro:0 "Передо мной [ttr_accused.GetShortUIName]. Обвинение гласит:"
 ttr_charge_rebellion:0 "\n\n#bold Неповиновение моей власти.#! За обвиняемым числится мятеж или отказ исполнить моё требование."
 ttr_charge_oathbreaker:0 "\n\n#bold Нарушение данной мне клятвы.#! Пренебрежение обязательствами верности передо мной."
 ttr_hearing_outro:0 "\n\nПора вынести решение. Доступны лишь те наказания, которые я могу назначить по закону."
 ttr_hearing_invalid:0 "Это дело больше нельзя рассматривать здесь. Обвиняемый мог умереть, выйти из-под моей власти или избавиться от этих обвинений."
 ttr_hearing_keep:0 "Оставить в заключении. Следующее дело."
 ttr_hearing_pardon:0 "Я прощаю эти проявления неверности."
 ttr_hearing_revoke:0 "Рассмотреть конфискацию титула."
 ttr_hearing_execute:0 "Казнить по закону."
 ttr_hearing_next:0 "Перейти к следующему делу."
 ttr_hearing_finish:0 "Закончить оставшиеся слушания без новых приговоров."
 ttr_keep_tt:0 "Узник останется под стражей. Суд перейдёт к следующему побеждённому мятежнику; это дело не вернётся в рамках завершения этой войны."
 ttr_pardon_tt:0 "Будут прощены только мятеж, отказ повиноваться и нарушение клятвы против вас. Обвиняемый в вашей темнице выйдет на свободу, только если не останется других оснований для наказания."
 ttr_revoke_tt:0 "Сразу открыть обычное окно отзыва титулов, сохраняя паузу. Действуют обычные требования и последствия. После отправки требования или закрытия окна суд автоматически перейдёт к следующему делу."
 ttr_execute_tt:0 "Казнить узника, только пока казнь допустима без тирании. Обычные последствия казни сохраняются."
 ttr_finish_tt:0 "Закончить оставшиеся дела этой войны, не назначая наказаний и не даруя прощения. Нынешнее заключение и титулы останутся без изменений. Позже эти слушания не возобновятся."
 ttr_invalid_tt:0 "Наказание не применяется. Суд перейдёт к следующему подходящему делу."
 ttr_execution_special_context_tt:0 "Приговор нельзя исполнить здесь, пока регентство или совместное правление требует дополнительного согласия."
 ttr.0090.t:0 "Суд окончен"
 ttr.0090.desc:0 "В этом заседании больше нет дел для рассмотрения. Приговоры вынесены; по пропущенным делам новых наказаний не назначено."
 ttr.0090.close:0 "Пусть двор вернётся к своим делам."
