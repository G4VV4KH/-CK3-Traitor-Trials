l_polish:
 ttr.0001.t:0 "Sąd po wojnie"
 ttr.0001.desc:0 "Bunt został stłumiony. Ci, którzy się poddali i trafili pod moją straż, oczekują teraz wyroku za udział w tej wojnie. Mogę rozpatrzyć ich sprawy razem, jedną po drugiej."
 ttr.0001.begin:0 "Rozpatrzyć ich sprawy."
 ttr.0001.skip:0 "Żadnych dalszych wyroków po tej wojnie."
 ttr_hearing_title:0 "Rozprawa o nielojalność"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName] staje przede mną. Oto treść oskarżenia:"
 ttr_charge_rebellion:0 "\n\n#bold Sprzeciw wobec mojej władzy.#! Oskarżenie dotyczy buntu lub odmowy spełnienia mojego żądania."
 ttr_charge_oathbreaker:0 "\n\n#bold Złamanie złożonej mi przysięgi.#! Oskarżenie dotyczy niedotrzymania przysięgi wobec mnie."
 ttr_hearing_outro:0 "\n\nMuszę zdecydować o dalszym postępowaniu. Dostępne są jedynie kary, które mogę zgodnie z prawem wymierzyć."
 ttr_hearing_invalid:0 "Tej sprawy nie można już tutaj rozpatrzyć. Osoba oskarżona mogła umrzeć, przestać podlegać mojej władzy lub uwolnić się od tych zarzutów."
 ttr_hearing_keep:0 "Pozostawić w więzieniu. Następna sprawa."
 ttr_hearing_pardon:0 "Wybaczam te przejawy nielojalności."
 ttr_hearing_revoke:0 "Rozważyć odebranie tytułu."
 ttr_hearing_execute:0 "Wykonać zgodną z prawem egzekucję."
 ttr_hearing_next:0 "Przejść do następnej sprawy."
 ttr_hearing_finish:0 "Zakończyć pozostałe rozprawy bez dalszych wyroków."
 ttr_keep_tt:0 "Ta osoba pozostanie w więzieniu. Przejdź do następnego pokonanego buntownika; ta sprawa nie powróci podczas rozliczania tej wojny."
 ttr_pardon_tt:0 "Przebaczenie obejmie tylko bunt, odmowę posłuszeństwa i złamanie przysięgi wobec ciebie. Osoba oskarżona przetrzymywana w twoim więzieniu zostanie uwolniona wyłącznie wtedy, gdy nie pozostaną inne podstawy do ukarania."
 ttr_revoke_tt:0 "Natychmiast otwórz standardowe okno odbierania tytułów, zachowując pauzę. Obowiązują zwykłe wymagania i konsekwencje. Wysłanie żądania lub zamknięcie okna automatycznie przeniesie sąd do następnej sprawy."
 ttr_execute_tt:0 "Dokonaj egzekucji tej osoby tylko wtedy, gdy jest ona dozwolona bez tyranii. Nadal obowiązują zwykłe konsekwencje egzekucji."
 ttr_finish_tt:0 "Zakończ pozostałe sprawy tej wojny bez wymierzania kar ani udzielania przebaczenia. Obecne uwięzienie i tytuły pozostaną bez zmian. Te rozprawy nie zostaną później wznowione."
 ttr_invalid_tt:0 "Nie zostanie wymierzona żadna kara. Przejdź do pozostałych spraw, które można jeszcze rozpatrzyć."
 ttr_execution_special_context_tt:0 "Nie można tutaj wykonać wyroku, dopóki regencja lub współrządy wymagają dodatkowej zgody."
 ttr.0090.t:0 "Rozprawy dobiegły końca"
 ttr.0090.desc:0 "W tym posiedzeniu nie ma już spraw do rozpatrzenia. Moje wyroki pozostają w mocy; pominięte sprawy nie przyniosły dalszych kar."
 ttr.0090.close:0 "Niech dwór wróci do swoich zajęć."
