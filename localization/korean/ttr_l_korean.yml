l_korean:
 ttr.0001.t:0 "전쟁이 끝난 뒤의 심판"
 ttr.0001.desc:0 "반란이 진압되었다. 항복하여 내 감옥에 갇힌 자들이 이 전쟁에 가담한 죄에 대한 판결을 기다린다. 이들의 사건을 한자리에 모아 차례대로 심리할 수 있다."
 ttr.0001.begin:0 "이들의 사건을 심리하겠다."
 ttr.0001.skip:0 "이 전쟁에 대해서는 더 이상의 형벌을 내리지 않겠다."
 ttr_hearing_title:0 "불충에 대한 심리"
 ttr_hearing_intro:0 "[ttr_accused.GetShortUIName]의 혐의를 내 앞에서 심리한다. 기록된 죄목은 다음과 같다."
 ttr_charge_rebellion:0 "\n\n#bold 내 권위에 대한 저항.#! 피고인은 반란을 일으키거나 내 요구를 거부한 혐의를 받고 있다."
 ttr_charge_oathbreaker:0 "\n\n#bold 나에 대한 맹세 파기.#! 피고인은 내게 한 맹세를 어겼다."
 ttr_hearing_outro:0 "\n\n이제 처분을 결정해야 한다. 내가 합법적으로 부과할 수 있는 형벌만 선택할 수 있다."
 ttr_hearing_invalid:0 "이 사건은 더 이상 여기서 심리할 수 없다. 피고인이 죽었거나, 내 관할을 벗어났거나, 이 혐의들을 더 이상 받지 않게 되었을 수 있다."
 ttr_hearing_keep:0 "계속 가두어 두어라. 다음 사건으로."
 ttr_hearing_pardon:0 "이러한 불충을 용서하겠다."
 ttr_hearing_revoke:0 "작위 박탈을 고려하겠다."
 ttr_hearing_execute:0 "법에 따라 처형하라."
 ttr_hearing_next:0 "다음 사건으로 넘어간다."
 ttr_hearing_finish:0 "추가 형벌 없이 남은 심리를 끝낸다."
 ttr_keep_tt:0 "이 죄수는 계속 구금됩니다. 다음으로 패배한 반란자의 사건을 심리합니다. 이번 전쟁을 수습하는 동안 이 사건을 다시 심리하지 않습니다."
 ttr_pardon_tt:0 "당신을 상대로 한 반란, 복종 거부, 맹세 파기 혐의만 용서합니다. 당신의 감옥에 있는 피고인은 처벌할 다른 범죄 근거가 남아 있지 않을 때에만 석방됩니다."
 ttr_revoke_tt:0 "일시 정지를 유지하면서 게임의 일반 작위 박탈 창을 즉시 엽니다. 통상적인 요건과 결과가 적용됩니다. 요구를 보내거나 창을 닫으면 자동으로 다음 사건으로 넘어갑니다."
 ttr_execute_tt:0 "폭정 없이 처형할 수 있는 동안에만 이 죄수를 처형합니다. 처형에 따른 통상적인 결과는 여전히 적용됩니다."
 ttr_finish_tt:0 "처벌을 추가하거나 사면하지 않고 이번 전쟁의 남은 사건들을 마칩니다. 현재의 구금 상태와 작위는 그대로 유지됩니다. 이 심리들은 나중에 다시 열리지 않습니다."
 ttr_invalid_tt:0 "처벌을 내리지 않습니다. 심리할 수 있는 나머지 사건들로 넘어갑니다."
 ttr_execution_special_context_tt:0 "섭정이나 공동 통치로 인해 추가 승인이 필요한 동안에는 여기서 형을 집행할 수 없습니다."
 ttr.0090.t:0 "심리 종료"
 ttr.0090.desc:0 "이번 재판에서 심리할 수 있는 사건은 더 이상 없다. 내 판결은 확정되었으며, 보류된 사건에는 추가 형벌이 내려지지 않았다."
 ttr.0090.close:0 "궁정이 본래의 업무로 돌아가도록 하라."
